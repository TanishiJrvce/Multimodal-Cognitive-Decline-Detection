[project]
name = "mcd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scikit-learn", "scipy", "torch", "torchaudio", "transformers",
  "librosa", "praat-parselmouth", "faster-whisper", "spacy", "shap", "matplotlib",
  "pyyaml", "tqdm", "openpyxl",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
